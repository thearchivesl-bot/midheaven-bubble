<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .banner {
    width: 92%;
    background: rgba(90, 90, 95, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  /* ── MESSAGES style ── */
  .icon-messages {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: #34C759;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-messages svg { width: 22px; height: 22px; }

  /* ── PHONE style ── */
  .icon-phone {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-phone svg { width: 20px; height: 20px; }

  .text-block {
    flex: 1;
    min-width: 0;
  }

  .sender {
    font-size: clamp(11px, 2.2vw, 14px);
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.01em;
  }

  .message {
    font-size: clamp(10px, 2vw, 13px);
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .timestamp {
    font-size: clamp(9px, 1.6vw, 11px);
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
    align-self: flex-start;
    flex-shrink: 0;
  }

  /* Phone call extras */
  .call-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-decline {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #FF3B30;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-accept {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #34C759;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-decline svg, .btn-accept svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="banner" id="banner">
  <!-- populated by JS -->
</div>

<script>
  function getParam(name, fallback) {
    const url = new URL(window.location.href);
    const val = url.searchParams.get(name);
    return (val && val.trim() !== '') ? decodeURIComponent(val) : fallback;
  }

  const style   = getParam('style',   'messages'); // "messages" or "phone"
  const sender  = getParam('sender',  'MESSAGES');
  const message = getParam('msg',     'now');
  const time    = getParam('time',    'now');

  const banner = document.getElementById('banner');

  if (style === 'phone') {
    banner.innerHTML = `
      <div class="icon-phone">
        <svg viewBox="0 0 24 24" fill="#34C759" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
        </svg>
      </div>
      <div class="text-block">
        <div class="sender">${sender}</div>
        <div class="message">incoming call</div>
      </div>
      <div class="call-actions">
        <div class="btn-decline">
          <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
          </svg>
        </div>
        <div class="btn-accept">
          <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
          </svg>
        </div>
      </div>
    `;
  } else {
    banner.innerHTML = `
      <div class="icon-messages">
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/>
        </svg>
      </div>
      <div class="text-block">
        <div class="sender">${sender}</div>
        <div class="message">${message}</div>
      </div>
      <div class="timestamp">${time}</div>
    `;
  }
</script>

</body>
</html>
